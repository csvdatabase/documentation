name: CI

on:
  push:
    branches: [main, 'v[0-9]+']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm audit
      - run: npm run build
        env:
          DOCS_BRANCH: ${{ github.base_ref || github.ref_name }}
      - name: Deploy branch to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DOCS_BRANCH: ${{ github.ref_name }}
        run: npx wrangler@4 pages deploy build --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$DOCS_BRANCH"
